name: Quant gateway baseline control
'on':
  push:
    branches: [verify/optional-0xarchive-backtest-145670]
permissions:
  contents: read
concurrency:
  group: quant-gateway-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  control:
    name: Gateway control (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: unchanged-base
            commit: e5ea5fd9ccdf2913c0b21b24eb3d22b321d2e2a6
            tree: c6a19fa70a93ae408d7661eedc51cc621ff49dcb
          - label: quant-candidate
            commit: 2a06cd5d9f9e15aa1228d96493b0d917d803499a
            tree: 11b1bd8898ad41d3a787ac8799c5fc0dff2a3fba
          - label: current-upstream
            commit: 664394605eb458a8fc3dd590cd1d9b6bda64dde0
            tree: 2376c44c299184b149b19720764adfa5466e8554
    steps:
      - name: Checkout exact contribution
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual tested source
        shell: bash
        env:
          TEST_COMMIT: ${{ matrix.commit }}
          TEST_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TEST_TREE"
          git --version
      - name: Set up native locked dependencies
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          packages: ffmpeg,ripgrep
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          cache: 'false'
          cache-python: 'false'
          cache-node: 'false'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'
          archive-inputs: 'false'
      - name: Run unchanged gateway journey cases
        shell: bash
        run: |
          scripts/run_tests.sh tests/gateway/test_journey_compress_restart_fifo.py
        env:
          HERMES_TEST_WORKERS: '4'
          HERMES_TEST_FILE_TIMEOUT: '600'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
      - name: Require unchanged tested source
        if: always()
        uses: ./.github/actions/check-clean-worktree
